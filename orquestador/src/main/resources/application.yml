spring:
  application:
    name: consultaec-orquestador

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

consultaec:
  servicios:
    sri:
      url: ${SERVICIO_SRI_URL:http://127.0.0.1:8081}
    ant:
      url: ${SERVICIO_ANT_URL:http://127.0.0.1:8082}
